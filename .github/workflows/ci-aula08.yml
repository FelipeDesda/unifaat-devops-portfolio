name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-08/technova-api/package-lock.json

      - name: Instalar dependências
        working-directory: aula-08/technova-api
        run: npm ci

      - name: Executar ESLint
        working-directory: aula-08/technova-api
        run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: aula-08/technova-api/package-lock.json

      - name: Instalar dependências
        working-directory: aula-08/technova-api
        run: npm ci

      - name: Executar testes com coverage
        working-directory: aula-08/technova-api
        run: npm run test:ci

      - name: Upload coverage report
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: aula-08/technova-api/coverage/
          retention-days: 14

  build:
    name: Build (Docker)
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        working-directory: aula-08/technova-api
        run: docker build -t technova-api:${{ github.sha }} .

      - name: Verificar imagem criada
        run: docker images technova-api

      - name: Testar container (smoke test)
        run: |
          docker run -d --name test-container -p 3000:3000 technova-api:${{ github.sha }}
          sleep 3
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container
          docker rm test-container

  pr-comment:
    name: PR Comment
    needs: [lint, test, build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comentar resultado do CI no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## 🤖 CI Pipeline Results

            | Stage | Status |
            |-------|--------|
            | Lint (ESLint) | ✅ Passed |
            | Tests (Jest) | ✅ Passed |
            | Build (Docker) | ✅ Passed |

            **Commit:** \`${context.sha.substring(0, 7)}\`

            ---
            _Gerado automaticamente pelo CI Pipeline_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });