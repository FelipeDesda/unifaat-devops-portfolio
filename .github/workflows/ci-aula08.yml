name: CI Pipeline — Aula 08

on:
  push:
    branches: [main, develop]
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/ci-aula08.yml'
      - '.eslintrc.json'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: aula-08/technova-api

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build (Docker)
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Build da imagem Docker
      run: docker build -t technova-api:${{ github.sha }} .

    - name: Verificar imagem criada
      run: docker images technova-api

    - name: Testar container (smoke test)
      run: |
        docker run -d --name test-container -p 3000:3000 technova-api:${{ github.sha }}
        sleep 3
        curl -f http://localhost:3000/health || exit 1
        docker stop test-container
        docker rm test-container

  verify-credentials:
    name: Verify Credentials
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar configuração AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Verificando credenciais AWS..."
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "✅ Credenciais AWS configuradas"
            echo "Região: $AWS_DEFAULT_REGION"
            # Com credenciais reais, aqui faria:
            # aws sts get-caller-identity
          else
            echo "❌ Credenciais AWS NÃO configuradas"
            exit 1
          fi
    
  pr-comment:
    name: PR Comment
    needs: [lint, test, build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comentar resultado do CI no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Evitar comentários duplicados
            const botComment = comments.find(comment =>
              comment.body.includes('## 🤖 CI Pipeline Results')
            );

            const body = `## 🤖 CI Pipeline Results

            | Stage | Status |
            |-------|--------|
            | Lint (ESLint) | ✅ Passed |
            | Tests (Jest) | ✅ Passed |
            | Build (Docker) | ✅ Passed |

            **Commit:** \`${context.sha.substring(0, 7)}\`
            **Workflow:** [Ver detalhes](${context.payload.repository.html_url}/actions/runs/${context.runId})

            ---
            _Gerado automaticamente pelo CI Pipeline_`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }